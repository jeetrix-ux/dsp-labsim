name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  # Create the draft once, so the Windows and macOS jobs upload into the same release instead of racing.
  draft:
    runs-on: ubuntu-latest
    steps:
      - run: gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1 || gh release create "$TAG" --repo "$REPO" --draft --title "DSP LabSim ${TAG#v}" --notes "Installers are being built."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run
      # Nothing is uploaded unless the app built for this OS can create, build and debug a project.
      - run: npm run dist:dir
      - run: npx playwright test tests/e2e/packaged.spec.ts
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
